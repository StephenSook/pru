version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /opt/hermes
    - /proc
    - /dev/urandom
    - /app
    - /run/nemoclaw/managed-startup-ca-bundle.pem
    - /run/nemoclaw/managed-startup-runtime.env
    - /run/nemoclaw/managed-gateway-expected-exit
    - /etc
    - /var/log
    - /var/lib/dpkg
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /dev/pts
    - /sandbox/.hermes
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  pru_gateway:
    name: pru_gateway
    endpoints:
      - host: pru-gateway.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/actions/send_email
          - allow:
              method: POST
              path: /v1/actions/create_event
          - allow:
              method: POST
              path: /v1/actions/llm_complete
    binaries:
      - path: /usr/local/bin/hermes
      - path: /usr/bin/python3.11
      - path: /opt/hermes/.venv/bin/python
