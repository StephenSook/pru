[workspace]
members = [
    "crates/pru-boundary",
    "crates/pru-consent",
    "crates/pru-policy",
    "crates/pru-ssn",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.22.1"
biscuit-auth = "6.0.0"
blake3 = "1.8.2"
cedar-policy = "4.13.0"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
http = "1.3.1"
rand = "0.9.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.9.8"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
yaml-rust2 = "0.10.4"
